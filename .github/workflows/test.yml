name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the rule tests need no packages: rules.mjs and vaults.mjs use only Node itself
      - run: npm test

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fake wallet and fake server: no network, no packages
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the web build takes the Identicons from server/node_modules
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -s web/dist/index.html && test -f web/dist/manifest.json

  hive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Hive signs in with @nimiq/core; it takes the one the server installs
      - run: npm ci
        working-directory: server
      # demo mode on a throwaway data folder: sample names and a demo wallet, no real money
      - name: Start Hive
        working-directory: hive
        run: |
          mkdir -p "$RUNNER_TEMP/hive-data"
          NIMIQ_CORE="file://$GITHUB_WORKSPACE/server/node_modules/@nimiq/core/nodejs/index.mjs" \
          IDENTICONS="$GITHUB_WORKSPACE/server/node_modules/@nimiq/identicons/dist/identicons.bundle.min.js" \
          DATA_DIR="$RUNNER_TEMP/hive-data" node server.mjs > "$RUNNER_TEMP/hive.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5197/api/hive && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/hive.log"; exit 1
      - run: node test-db.mjs      # database: structure, queries, field rules, player sign-in, limits
        working-directory: hive
      - run: node test-giris.mjs   # a signature over a changed sign-in text never opens a session
        working-directory: hive
